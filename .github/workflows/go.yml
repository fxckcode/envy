name: Go validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          check-latest: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))
          test -z "$unformatted" || {
            printf 'The following files are not gofmt-formatted:\n%s\n' "$unformatted"
            exit 1
          }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...
